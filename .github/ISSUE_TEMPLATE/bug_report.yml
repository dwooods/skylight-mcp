name: Something is broken
description: A tool errors, returns wrong data, or setup fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This project is an unofficial, reverse-engineered integration. Skylight can change its API without notice, so "worked yesterday, fails today" is a useful report.

        **Never paste** tokens, your frame ID, email addresses, family names, calendar IDs, your Worker URL, KV namespace IDs, or browser captures (HAR files, DevTools screenshots with headers). Issues are public. Replace values with placeholders like `your_frame_id`.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact prompt you gave Claude and the tool it called, if you know it.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `doctor`
      description: Run `npx -y @davidwoods/skylight-mcp doctor` (see the README). It does not print tokens or your frame ID. Paste it as is.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Local, via npx
        - Local, from source (git clone)
        - Hosted Cloudflare Worker (my own deploy)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      description: Claude desktop, Claude Code, Claude Duet, another MCP client. Add its version if you know it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: From source, the version in package.json. With npx, the date you last ran it is enough.
  - type: textarea
    id: error
    attributes:
      label: Error text or logs
      description: Redact anything identifying first.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed tokens, my frame ID, emails, family names, calendar IDs and any Worker or KV identifiers.
          required: true
        - label: I ran `doctor` and read the README Troubleshooting table.
          required: true
