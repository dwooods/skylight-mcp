name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action derives a commit range from the push event,
      # which breaks on the first push to a repo (the "before" commit does not
      # exist) and then reports failure after scanning nothing. Run the CLI
      # over the whole history instead; this repo is small.
      # The container runs as a different uid, so git refuses the checkout
      # ("dubious ownership") unless its HOME says the workspace is safe.
      # Docker-based steps get $RUNNER_TEMP/_github_home as HOME.
      - name: Allow the container's git to read the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/_github_home"
          printf '[safe]\n\tdirectory = /github/workspace\n' >> "$RUNNER_TEMP/_github_home/.gitconfig"

      - name: Run gitleaks over full history
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          args: git --redact --no-banner --verbose --exit-code=1 --config .gitleaks.toml .
