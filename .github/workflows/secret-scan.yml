name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action derives a commit range from the push event,
      # which breaks on the first push to a repo (the "before" commit does not
      # exist) and then reports failure after scanning nothing. Run the CLI
      # over the whole history instead; this repo is small.
      - name: Run gitleaks over full history
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          args: git --redact --no-banner --verbose --exit-code=1 --config .gitleaks.toml .
