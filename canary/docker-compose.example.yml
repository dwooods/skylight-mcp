# Example stack for the breakage canary. Copy it out of the repo and keep the real values
# (frame id, ping address) in the stack's environment variables (Portainer: "Environment
# variables"), never in a file in this repository.
services:
  skylight-canary:
    build:
      context: ..            # the repository root, where the Dockerfile is
    container_name: skylight-canary
    restart: unless-stopped
    init: true
    user: "1000:1000"        # the uid:gid that owns the credential folder below
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SKYLIGHT_FRAME_ID: "${SKYLIGHT_FRAME_ID}"       # digits, from your Skylight URLs
      SKYLIGHT_TIMEZONE: "${SKYLIGHT_TIMEZONE}"       # for example America/Los_Angeles
      CANARY_PING_URL: "${CANARY_PING_URL}"           # https://hc-ping.com/<check uuid>; a secret
      CANARY_TIME: "${CANARY_TIME:-09:30}"            # local time of the daily run
    volumes:
      # A private folder, ideally on an encrypted shared folder. Holds the sign-in, which is
      # the full Skylight login: anyone who can read it can use the account.
      - /path/to/private/skylight-canary:/data
