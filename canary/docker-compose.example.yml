# Example stack for the breakage canary. Copy it out of the repo and keep the real values
# (frame id, timezone) in the stack's environment variables (Portainer: "Environment
# variables"), never in a file in this repository.
services:
  skylight-canary:
    build:
      context: ..            # the repository root, where the Dockerfile is
    container_name: skylight-canary
    restart: unless-stopped   # idles (tail -f /dev/null); the host scheduler runs the check with docker exec
    init: true
    user: "${CANARY_UID:-1000}:${CANARY_GID:-100}"   # the uid:gid that owns the credential folder below
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SKYLIGHT_FRAME_ID: "${SKYLIGHT_FRAME_ID}"       # digits, from your Skylight URLs
      SKYLIGHT_TIMEZONE: "${SKYLIGHT_TIMEZONE}"       # for example America/Los_Angeles
      CANARY_DINNER_NAME: "${CANARY_DINNER_NAME:-Dinner}"   # meal category that must exist
    volumes:
      # A private folder, ideally on an encrypted shared folder. Holds the sign-in, which is
      # the full Skylight login: anyone who can read it can use the account.
      - ${CANARY_DATA_DIR}:/data      # for example /volume1/docker/skylight-canary
